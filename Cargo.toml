[package]
name = "homeostasis-ingress-proxy"
version = "1.0.0"
edition = "2021"
description = "Pure Ingress Hardware Control Orchestrator Hub"
license = "AGPL-3.0-only"

[dependencies]
# Asynchronous multi-threading and high-speed network polling core
tokio = { version = "1.38", features = ["full"] }

# Core library for eBPF/XDP kernel map control and shared memory binding
libbpf-rs = "0.22"

[build-dependencies]
# [Structural Specification Synchronization: Automated CUDA FFI Static Link Interlock]
# Build script rail to automatically compile target_hardware_cuda/skewness_kernel.cu via nvcc within build.rs
cc = "1.0"

[profile.release]
opt-level = 3           # Maximum compression optimization level for hardware register pipeline computations (O3)
lto = true              # Link-time optimization (LTO) enabled to eliminate dead code globally
codegen-units = 1       # Restricts code generation to a single unit to maximize compiler optimization merge efficiency
panic = "abort"         # Aborts on panic to eliminate stack unwinding tracking overhead and prevent latency jitter

